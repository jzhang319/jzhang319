name: Work Stats Readme

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          # WakaTime API keys only work for IDE plugins from Nov 1, 2026.
          # This input now takes a personal OAuth token (sent the same way, as ?api_key=).
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE : True
          SHOW_EDITORS : False
          SHOW_TIMEZONE : False
          SHOW_DAYS_OF_WEEK : False
          SHOW_PROJECTS : False
          SHOW_SHORT_INFO : False
